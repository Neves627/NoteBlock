<!DOCTYPE html>
<html>
<head>
  <div class="cabecalho-menu" style="margin-top: 30px; text-align: left; padding-left: 4px;">
    <img src="images/logo.png" alt="Logo" style="max-width: 180px; height: auto; display: block;">
  </div>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css">
</head>
<body class="corpo-menu">
  <div class="toolbar" style="-webkit-app-region: drag;">
  <button id="btnTema" title="Alternar tema" style="-webkit-app-region: no-drag; right: 30px; position: absolute;">
    <i class="mdi mdi-white-balance-sunny"></i>
  </button>
  <button id="btnFechar" title="Fechar" style="-webkit-app-region: no-drag;">❌</button>
</div>

  <!-- Formulário direto para criar nota com nome -->
  <div class="novo-alarme" style="margin-bottom: 12px; border: none; padding: 0;">
    <input type="text" id="inputNovoNome" placeholder="Nome da nova nota..." style="padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; margin-bottom: 4px;">
    <button id="btnCriarNota" style="background: #d99a2b; border: none; color: white; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 12px;">➕ Criar Nota</button>
  </div>
  
  <div id="listaNotasContainer"></div>

  <script src="js/menu.js"></script>
</body>
</html>
