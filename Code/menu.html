<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>NoteBlock</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="css/estilos.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            accent: '#7C3AED',
            accentLight: '#A78BFA'
          }
        }
      }
    };
  </script>
</head>
<body class="corpo-menu min-h-screen select-none overflow-x-hidden bg-slate-50 text-slate-800 dark:bg-[#12101c] dark:text-slate-100 transition-colors duration-200">

  <!-- Linha de topo sem barra: logo à esquerda e botões à direita -->
  <div class="pt-1 px-3 flex items-center justify-between gap-2" style="-webkit-app-region: drag;">
    <div class="cabecalho-menu flex items-center min-w-0 shrink">
      <img
        src="images/logo2.png"
        alt="NoteBlock Logo"
        class="h-7 max-w-[135px] w-auto object-contain block"
      >
    </div>

    <div class="flex items-center gap-0.5 shrink-0 pr-0.5" style="-webkit-app-region: no-drag;">
      <button id="btnMinimizar" title="Minimizar" class="btn btn-ghost btn-xs btn-square rounded-xl">
        <i class="mdi mdi-window-minimize text-sm"></i>
      </button>
      <button id="btnTema" title="Alternar tema" class="btn btn-ghost btn-xs btn-square rounded-xl">
        <i class="mdi mdi-white-balance-sunny text-sm"></i>
      </button>
      <button id="btnFechar" title="Fechar" class="btn btn-ghost btn-xs btn-square rounded-xl text-error">
        <i class="mdi mdi-close text-sm"></i>
      </button>
    </div>
  </div>

  <!-- Conteúdo principal -->
  <div class="px-3 pb-3 pt-3 space-y-4" style="-webkit-app-region: no-drag;">

    <!-- Criar nova nota -->
    <div
      class="bg-white dark:bg-[#1e1a2e] border border-slate-200/90 dark:border-purple-400/25 rounded-2xl p-3 shadow-sm space-y-2.5"
      style="-webkit-app-region: no-drag;"
    >
      <input
        type="text"
        id="inputNovoNome"
        placeholder="Nome da nova nota..."
        style="-webkit-app-region: no-drag;"
        class="input input-bordered input-sm w-full bg-slate-50 dark:bg-[#141120] border-slate-200 dark:border-purple-400/25 text-xs focus:outline-none focus:border-accent"
      >
      <button
        id="btnCriarNota"
        style="-webkit-app-region: no-drag;"
        class="btn btn-sm w-full bg-accent hover:bg-purple-600 border-none text-white font-medium gap-1.5 rounded-xl shadow-sm shadow-purple-600/25"
      >
        <i class="mdi mdi-plus text-base"></i>
        <span>Criar Nota</span>
      </button>
    </div>

    <!-- Lista de notas -->
    <div class="pt-1 space-y-2" style="-webkit-app-region: no-drag;">
      <div class="px-1 flex items-center justify-between text-[11px] font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-400">
        <span>As tuas notas</span>
      </div>
      <div id="listaNotasContainer" class="space-y-2"></div>
    </div>

  </div>

  <script src="js/menu.js"></script>
</body>
</html>
