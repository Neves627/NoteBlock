<!DOCTYPE html>
<html>
<head>
  <title>Nota</title>
  <style>
    body {
      background-color: #fff2ba;
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
    }
    #texto {
    margin-top: 20px; 
    outline: none;
    }
    #texto.empty::before {
      content:attr(data-placeholder);
      color: #999;
      outline: none;
      font-size: 16px;
      color: #333;
      min-height: 150px;
    }
    body{
      position: relative;
    }
    #canvas{
      position: absolute;
      top: 40px;
      width: 100%;
      left:0;
      display: block;
      pointer-events: none;
    }
    body.desenhando #canvas{
      pointer-events: auto;
      cursor: crosshair;
    }
    body.desenhando #texto{
      pointer-events: none;
    }
    #btnDesenhar{
      position: absolute;
      top: 4px;
      right: 4px;
    }
    #btnFechar {
      position: absolute;
      top: 4px;
      left: 4px; 
      z-index: 10;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .toolbar{ 
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      -webkit-app-region: drag;
     }
    #btnDesenhar, #btnBorracha, #btnLimpar {
    position: absolute;
    top: 4px;
    z-index: 10;
    }
    .toolbar button{ -webkit-app-region: no-drag; }
    #btnDesenhar { right: 76px; }
    #btnBorracha { right: 40px; }
    #btnLimpar { right: 4px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="btnFechar" title="Fechar">❌</button>
  <button id="btnDesenhar">✏️</button>
  <button id="btnBorracha" title="Borracha">🧹</button>
  <button id="btnLimpar" title="Limpar tudo">🗑️</button>
  </div>
  <div contenteditable="true" id="texto" data-placeholder="Escreve a tua nota..." spellcheck="false">  </div>
  <canvas id="canvas"></canvas>
</body>
  <script>
      //Placeholder and text save
      const texto = document.getElementById('texto');
      function atualizarPlaceholder() {
        if (texto.innerText.trim() === '') {
          texto.classList.add('empty');
        } else {
          texto.classList.remove('empty');
        }
      }
      texto.addEventListener('input', atualizarPlaceholder);
      atualizarPlaceholder();

      texto.innerText = window.notaAPI.carregar();
      const desenhoGuardado = window.notaAPI.carregarDesenho();
      if (desenhoGuardado) {
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0);
        };
        img.src = desenhoGuardado;
      }
      atualizarPlaceholder();

      texto.addEventListener('input', () => {
      atualizarPlaceholder();
      window.notaAPI.guardar(texto.innerText);
      });


      //canvas drawing
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 250;
      canvas.height = 210;

      const btnDesenhar = document.getElementById('btnDesenhar');
      btnDesenhar.addEventListener('click', () => {
      modoBorracha = false;
      ctx.globalCompositeOperation = 'source-over'; 
      ctx.strokeStyle = '#000000'; 
      ctx.lineWidth = 2;
      document.body.classList.toggle('desenhando');
      });

      let aDesenhar = false;

      let modoBorracha = false;
      

      // Event listeners for the eraser and clear buttons
      const btnBorracha = document.getElementById('btnBorracha');
      btnBorracha.addEventListener('click', () => {
      document.body.classList.add('desenhando');
      modoBorracha = true;
      ctx.globalCompositeOperation = 'destination-out'; 
      ctx.lineWidth = 12; 
      });

      const btnLimpar = document.getElementById('btnLimpar');
      btnLimpar.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      window.notaAPI.guardarDesenho(canvas.toDataURL());
      });

      const btnFechar = document.getElementById('btnFechar');
      btnFechar.addEventListener('click', () => {
      window.notaAPI.fecharJanela();
      });

      canvas.addEventListener('mousedown', (e) => {
        aDesenhar = true;
        ctx.beginPath();
        ctx.moveTo(e.offsetX, e.offsetY);
      });

      canvas.addEventListener('mousemove', (e) => {
        if (!aDesenhar) return;
        ctx.lineTo(e.offsetX, e.offsetY);
        ctx.stroke();
      });

      canvas.addEventListener('mouseup', () => {
        aDesenhar = false;
        window.notaAPI.guardarDesenho(canvas.toDataURL());
      });

      canvas.addEventListener('mouseleave', () => {
        aDesenhar = false;
      });

      function redimensionarCanvas() {
      const desenhoAtual = canvas.toDataURL();

      // Canvas size adjustment
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - 40;

      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0);
      };
      img.src = desenhoAtual;
    }
    
    redimensionarCanvas();

    window.addEventListener('resize', () => {
      redimensionarCanvas();
    });

    window.addEventListener('resize', () => {
    redimensionarCanvas();
  
      
    window.notaAPI.guardarTamanho(window.innerWidth, window.innerHeight);
    });

  </script>
</html>
