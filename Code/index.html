<!DOCTYPE html>
<html>
<head>
  <title>Nota</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
</head>
<body>
  <div class="toolbar">
    <button id="btnFechar" title="Fechar" aria-label="Fechar">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x preview-icon">
        <path d="M18 6 6 18"/>
        <path d="m6 6 12 12"/>
      </svg>
    </button>
    <button id="btnPin" title="Afixar no topo" aria-label="Afixar no topo">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pin preview-icon">
        <path d="M12 17v5"/>
        <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>
      </svg>
    </button>
    <button id="btnDesenhar" title="Desenhar" aria-label="Desenhar">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil-line preview-icon">
        <path d="M13 21h8"/>
        <path d="m15 5 4 4"/>
        <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
      </svg>
    </button>
    <button id="btnBorracha" title="Borracha" aria-label="Borracha">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paintbrush preview-icon">
        <path d="m14.622 17.897-10.68-2.913"/>
        <path d="M18.376 2.622a1 1 0 1 1 3.002 3.002L17.36 9.643a.5.5 0 0 0 0 .707l.944.944a2.41 2.41 0 0 1 0 3.408l-.944.944a.5.5 0 0 1-.707 0L8.354 7.348a.5.5 0 0 1 0-.707l.944-.944a2.41 2.41 0 0 1 3.408 0l.944.944a.5.5 0 0 0 .707 0z"/>
        <path d="M9 8c-1.804 2.71-3.97 3.46-6.583 3.948a.507.507 0 0 0-.302.819l7.32 8.883a1 1 0 0 0 1.185.204C12.735 20.405 16 16.792 16 15"/>
      </svg>
    </button>
    <button id="btnLimpar" title="Limpar tudo" aria-label="Limpar tudo">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash preview-icon">
        <path d="M10 11v6"/>
        <path d="M14 11v6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
        <path d="M3 6h18"/>
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
    </button>
    <button id="btnAlarme" title="Alarme" aria-label="Alarme">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-alarm-clock preview-icon">
        <circle cx="12" cy="13" r="8"/>
        <path d="M12 9v4l2 2"/>
        <path d="M5 3 2 6"/>
        <path d="m22 6-3-3"/>
        <path d="M6.38 18.7 4 21"/>
        <path d="M17.64 18.67 20 21"/>
      </svg>
    </button>
    <button id="btnFundo" title="Mudar fundo" aria-label="Mudar fundo">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-palette preview-icon">
        <path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/>
        <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
        <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
        <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
        <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <input type="text" id="tituloNotaInput" placeholder="Título da nota...">
  <div contenteditable="true" id="texto" data-placeholder="Escreve a tua nota..." spellcheck="false"></div>
  <canvas id="canvas"></canvas>

  <!-- Painel de Alarmes -->
  <div id="painelAlarme" class="painel-overlay" style="display:none;">
    <div class="painel-conteudo alarme-modal">
      <div class="painel-header alarme-header">
        <div>
          <span class="alarme-titulo-modal">⏰ Alarmes</span>
          <small class="alarme-subtitulo">Lembretes desta nota</small>
        </div>
        <button id="btnFecharPainel" title="Fechar">✕</button>
      </div>

      <div id="listaAlarmes" class="alarme-lista"></div>

      <div class="novo-alarme alarme-form">
        <div class="alarme-campo">
          <label for="alarmeTitulo">Título (opcional)</label>
          <input type="text" id="alarmeTitulo" placeholder="Ex.: Reunião, tomar medicação...">
        </div>

        <div class="alarme-linha-2col">
          <div class="alarme-campo">
            <label for="alarmeHora">Hora</label>
            <input type="time" id="alarmeHora" value="09:00">
          </div>
          <div class="alarme-campo">
            <label for="alarmeSom">Som</label>
            <select id="alarmeSom">
              <option value="sons/alarme1.mp3">🔔 Alarme Padrão</option>
              <option value="sons/digital.mp3">⚡ Digital</option>
              <option value="sons/suave.mp3">🎵 Sino Suave</option>
            </select>
          </div>
        </div>

        <div class="alarme-campo">
          <div class="alarme-label-row">
            <label>Repetir nos dias</label>
            <button type="button" id="btnDiasUteis" class="alarme-chip-acao">Seg–Sex</button>
          </div>
          <div id="diasSemana" class="alarme-dias-grid">
            <button type="button" data-dia="0">Dom</button>
            <button type="button" data-dia="1">Seg</button>
            <button type="button" data-dia="2">Ter</button>
            <button type="button" data-dia="3">Qua</button>
            <button type="button" data-dia="4">Qui</button>
            <button type="button" data-dia="5">Sex</button>
            <button type="button" data-dia="6">Sáb</button>
          </div>
        </div>

        <div class="alarme-campo">
          <label for="alarmeData">Ou numa data específica <span class="alarme-dica">(se não escolheres dias)</span></label>
          <input type="date" id="alarmeData" placeholder="Escolher data...">
        </div>

        <div id="erroAlarme" class="alarme-erro" style="display:none;"></div>
        <button type="button" id="btnGuardarAlarme" class="alarme-btn-guardar">+ Guardar alarme</button>
      </div>
    </div>
  </div>

  <!-- Painel de Alarme a Tocar -->
  <div id="painelTocar" class="painel-overlay" style="display:none;">
    <div class="painel-conteudo" style="text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px;">
      <h2 style="margin: 0; color: #b33a3a;">⏰ Alarme a Tocar!</h2>
      <p id="tituloAlarmeAtivo" style="margin: 0; font-size: 16px; font-weight: bold; color: #333;"></p>
      <p id="textoAlarmeAtivo" style="margin: 0; color: #666;"></p>
      <button id="btnPararAlarme" style="padding: 10px 20px; background: #d64545; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer;">Parar Alarme</button>
    </div>
  </div>

  <audio id="somAlarme" preload="auto"></audio>

  <script src="js/nota-janela.js"></script>
  <script src="js/fundos.js"></script>
</body>
</html>
