<!DOCTYPE html>
<html>
<head>
  <title>Nota</title>
  <style>
    body {
      background-color: #fff2ba;
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
    }
    #texto.empty::before {
      content:attr(data-placeholder);
      color: #999;
      outline: none;
      font-size: 16px;
      color: #333;
      min-height: 150px;
    }
    body{
      position: relative;
    }
    #canvas{
      position: absolute;
      top: 40px;
      left:0;
      display: block;
      pointer-events: none;
    }
    body.desenhando #canvas{
      pointer-events: auto;
      cursor: crosshair;
    }
    body.desenhando #texto{
      pointer-events: none;
    }
    #btnDesenhar{
      position: absolute;
      top: 4px;
      right: 4px;
    }
    #btnDesenhar, #btnBorracha, #btnLimpar {
    position: absolute;
    top: 4px;
    z-index: 10;
    }
    #btnDesenhar { right: 76px; }
    #btnBorracha { right: 40px; }
    #btnLimpar { right: 4px; }
  </style>
</head>
<body>
  <div class="toolbar">
  <button id="btnDesenhar">✏️</button>
  <button id="btnBorracha" title="Borracha">🧹</button>
  <button id="btnLimpar" title="Limpar tudo">🗑️</button>
  </div>
  <div contenteditable="true" id="texto" data-placeholder="Escreve a tua nota..." spellcheck="false">  </div>
  <canvas id="canvas"></canvas>
</body>
  <script>
      const texto = document.getElementById('texto');
      function atualizarPlaceholder() {
        if (texto.innerText.trim() === '') {
          texto.classList.add('empty');
        } else {
          texto.classList.remove('empty');
        }
      }
      texto.addEventListener('input', atualizarPlaceholder);
      atualizarPlaceholder();

      texto.innerText = window.notaAPI.carregar();
      const desenhoGuardado = window.notaAPI.carregarDesenho();
      if (desenhoGuardado) {
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0);
        };
        img.src = desenhoGuardado;
      }
      atualizarPlaceholder();

      texto.addEventListener('input', () => {
      atualizarPlaceholder();
      window.notaAPI.guardar(texto.innerText);
      });

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 250;
      canvas.height = 210;

      btnDesenhar.addEventListener('click', () => {
      modoBorracha = false;
      ctx.globalCompositeOperation = 'source-over'; 
      ctx.strokeStyle = '#000000'; 
      ctx.lineWidth = 2;
      document.body.classList.toggle('desenhando');
      });

      let aDesenhar = false;

      let modoBorracha = false;

      const btnBorracha = document.getElementById('btnBorracha');
      btnBorracha.addEventListener('click', () => {
      document.body.classList.add('desenhando');
      modoBorracha = true;
      ctx.globalCompositeOperation = 'destination-out'; // "Apaga" tornando os píxeis transparentes
      ctx.lineWidth = 12; // Espessura da borracha
      });

      // Botão Limpar Tudo: Limpa o canvas e atualiza o armazenamento
      const btnLimpar = document.getElementById('btnLimpar');
      btnLimpar.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      window.notaAPI.guardarDesenho(canvas.toDataURL());
      });

      canvas.addEventListener('mousedown', (e) => {
        aDesenhar = true;
        ctx.beginPath();
        ctx.moveTo(e.offsetX, e.offsetY);
      });

      canvas.addEventListener('mousemove', (e) => {
        if (!aDesenhar) return;
        ctx.lineTo(e.offsetX, e.offsetY);
        ctx.stroke();
      });

      canvas.addEventListener('mouseup', () => {
        aDesenhar = false;
        window.notaAPI.guardarDesenho(canvas.toDataURL());
      });

      canvas.addEventListener('mouseleave', () => {
        aDesenhar = false;
      });

  </script>
</html>
