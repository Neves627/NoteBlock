<!DOCTYPE html>
<html>
<head>
  <title>Nota</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
</head>
<body>
  <div class="toolbar">
    <button id="btnFechar" title="Fechar">❌</button>
    <button id="btnDesenhar" title="Desenhar">✏️</button>
    <button id="btnBorracha" title="Borracha">🧹</button>
    <button id="btnLimpar" title="Limpar tudo">🗑️</button>
    <button id="btnAlarme" title="Alarme">⏰</button>
  </div>

  <input type="text" id="tituloNotaInput" placeholder="Título da nota...">
  <div contenteditable="true" id="texto" data-placeholder="Escreve a tua nota..." spellcheck="false"></div>
  <canvas id="canvas"></canvas>

  <!-- Painel de Alarmes -->
  <div id="painelAlarme" class="painel-overlay" style="display:none;">
    <div class="painel-conteudo">
      <div class="painel-header">
        <span>Alarmes</span>
        <button id="btnFecharPainel">✕</button>
      </div>
      <div id="listaAlarmes"></div>
      <div class="novo-alarme">
        <input type="text" id="alarmeTitulo" placeholder="Título do alarme">
        <input type="date" id="alarmeData">
        <input type="time" id="alarmeHora" value="09:00">
        
        <select id="alarmeSom">
          <option value="sons/alarme1.mp3">Alarme Padrão</option>
          <option value="sons/digital.mp3">Digital</option>
          <option value="sons/suave.mp3">Sino Suave</option>
        </select>

        <div id="diasSemana">
          <button data-dia="0">D</button>
          <button data-dia="1">S</button>
          <button data-dia="2">T</button>
          <button data-dia="3">Q</button>
          <button data-dia="4">Q</button>
          <button data-dia="5">S</button>
          <button data-dia="6">S</button>
        </div>
        <div id="erroAlarme" style="display:none;"></div>
        <button id="btnGuardarAlarme">Adicionar alarme</button>
      </div>
    </div>
  </div>

  <!-- Painel de Alarme a Tocar -->
  <div id="painelTocar" class="painel-overlay" style="display:none;">
    <div class="painel-conteudo" style="text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px;">
      <h2 style="margin: 0; color: #b33a3a;">⏰ Alarme a Tocar!</h2>
      <p id="tituloAlarmeAtivo" style="margin: 0; font-size: 16px; font-weight: bold; color: #333;"></p>
      <p id="textoAlarmeAtivo" style="margin: 0; color: #666;"></p>
      <button id="btnPararAlarme" style="padding: 10px 20px; background: #d64545; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer;">Parar Alarme</button>
    </div>
  </div>

  <audio id="somAlarme" preload="auto"></audio>

  <!-- Scripts organizados que trazem de volta todas as funcionalidades -->
  <script src="js/nota-janela.js"></script>
</body>
</html>
