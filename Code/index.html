<!DOCTYPE html>
<html>
<head>
  <title>Nota</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
</head>
<body>
  <div class="toolbar">
    <button id="btnFechar" title="Fechar">❌</button>
    <button id="btnDesenhar" title="Desenhar">✏️</button>
    <button id="btnBorracha" title="Borracha">🧹</button>
    <button id="btnLimpar" title="Limpar tudo">🗑️</button>
    <button id="btnAlarme" title="Alarme">⏰</button>
    <button id="btnFundo" title="Mudar fundo">🎨</button>
  </div>

  <input type="text" id="tituloNotaInput" placeholder="Título da nota...">
  <div contenteditable="true" id="texto" data-placeholder="Escreve a tua nota..." spellcheck="false"></div>
  <canvas id="canvas"></canvas>

  <!-- Painel de Alarmes -->
  <div id="painelAlarme" class="painel-overlay" style="display:none;">
    <div class="painel-conteudo alarme-modal">
      <div class="painel-header alarme-header">
        <div>
          <span class="alarme-titulo-modal">⏰ Alarmes</span>
          <small class="alarme-subtitulo">Lembretes desta nota</small>
        </div>
        <button id="btnFecharPainel" title="Fechar">✕</button>
      </div>

      <div id="listaAlarmes" class="alarme-lista"></div>

      <div class="novo-alarme alarme-form">
        <div class="alarme-campo">
          <label for="alarmeTitulo">Título (opcional)</label>
          <input type="text" id="alarmeTitulo" placeholder="Ex.: Reunião, tomar medicação...">
        </div>

        <div class="alarme-linha-2col">
          <div class="alarme-campo">
            <label for="alarmeHora">Hora</label>
            <input type="time" id="alarmeHora" value="09:00">
          </div>
          <div class="alarme-campo">
            <label for="alarmeSom">Som</label>
            <select id="alarmeSom">
              <option value="sons/alarme1.mp3">🔔 Alarme Padrão</option>
              <option value="sons/digital.mp3">⚡ Digital</option>
              <option value="sons/suave.mp3">🎵 Sino Suave</option>
            </select>
          </div>
        </div>

        <div class="alarme-campo">
          <div class="alarme-label-row">
            <label>Repetir nos dias</label>
            <button type="button" id="btnDiasUteis" class="alarme-chip-acao">Seg–Sex</button>
          </div>
          <div id="diasSemana" class="alarme-dias-grid">
            <button type="button" data-dia="0">Dom</button>
            <button type="button" data-dia="1">Seg</button>
            <button type="button" data-dia="2">Ter</button>
            <button type="button" data-dia="3">Qua</button>
            <button type="button" data-dia="4">Qui</button>
            <button type="button" data-dia="5">Sex</button>
            <button type="button" data-dia="6">Sáb</button>
          </div>
        </div>

        <div class="alarme-campo">
          <label for="alarmeData">Ou numa data específica <span class="alarme-dica">(se não escolheres dias)</span></label>
          <input type="date" id="alarmeData" placeholder="Escolher data...">
        </div>

        <div id="erroAlarme" class="alarme-erro" style="display:none;"></div>
        <button type="button" id="btnGuardarAlarme" class="alarme-btn-guardar">+ Guardar alarme</button>
      </div>
    </div>
  </div>

  <!-- Painel de Alarme a Tocar -->
  <div id="painelTocar" class="painel-overlay" style="display:none;">
    <div class="painel-conteudo" style="text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px;">
      <h2 style="margin: 0; color: #b33a3a;">⏰ Alarme a Tocar!</h2>
      <p id="tituloAlarmeAtivo" style="margin: 0; font-size: 16px; font-weight: bold; color: #333;"></p>
      <p id="textoAlarmeAtivo" style="margin: 0; color: #666;"></p>
      <button id="btnPararAlarme" style="padding: 10px 20px; background: #d64545; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer;">Parar Alarme</button>
    </div>
  </div>

  <audio id="somAlarme" preload="auto"></audio>

  <!-- Scripts organizados que trazem de volta todas as funcionalidades -->
  <script src="js/nota-janela.js"></script>
  <script src="js/fundos.js"></script>
</body>
</html>
